<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERFAN // WEB3 & FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #030509;
            background-image: 
                linear-gradient(to right, rgba(30, 41, 59, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.22) 1px, transparent 1px),
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12), transparent 60%);
            background-size: 38px 38px, 38px 38px, 100% 100%;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1200px;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* 1. PURE ETHEREUM PORTAL (NO TEXT, MULTI-LAYER ORBITAL ANIMATIONS) */
        #portal-overlay {
            position: fixed;
            inset: 0;
            background-color: #030509;
            background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.14), transparent 45%);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 1.15s cubic-bezier(0.7, 0, 0.2, 1),
                        filter 0.9s ease;
        }
        #portal-overlay.warp-out {
            opacity: 0;
            transform: scale(3.5) translateZ(450px);
            filter: blur(20px) brightness(2.4);
            pointer-events: none;
        }

        .portal-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Breathing Pulse Ring */
        .pulse-halo {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.25);
            animation: haloPulse 3.2s ease-in-out infinite;
        }
        @keyframes haloPulse {
            0%, 100% { transform: scale(0.92); opacity: 0.2; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
            50% { transform: scale(1.12); opacity: 0.65; box-shadow: 0 0 50px rgba(56, 189, 248, 0.35); }
        }

        /* Outer Energy Orbit with Glowing Nodes */
        .energy-orbit-outer {
            position: absolute;
            width: 196px;
            height: 196px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(56, 189, 248, 0.85);
            border-right-color: rgba(99, 102, 241, 0.4);
            animation: orbitCW 7s linear infinite;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }
        .energy-orbit-outer::before {
            content: '';
            position: absolute;
            top: 14px;
            right: 22px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 14px #38bdf8, 0 0 24px #38bdf8;
        }
        @keyframes orbitCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Middle Counter-Rotating Dashed Cyber Ring */
        .energy-orbit-mid {
            position: absolute;
            width: 162px;
            height: 162px;
            border-radius: 50%;
            border: 1.5px dashed rgba(16, 185, 129, 0.45);
            animation: orbitCCW 11s linear infinite;
        }
        .energy-orbit-mid::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 12px #10b981;
        }
        @keyframes orbitCCW {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Inner Core Sphere + Floating Ethereum Logo */
        .portal-core {
            position: relative;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.75) 0%, rgba(7, 10, 19, 0.96) 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.2), inset 0 0 25px rgba(56, 189, 248, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .eth-logo-anim {
            animation: levitateEth 2.8s ease-in-out infinite;
        }
        @keyframes levitateEth {
            0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.25)); }
            50% { transform: translateY(-7px) scale(1.06); filter: drop-shadow(0 0 22px rgba(56,189,248,0.75)); }
        }
        .portal-wrapper:hover .portal-core {
            border-color: #38bdf8;
            box-shadow: 0 0 70px rgba(56, 189, 248, 0.45), inset 0 0 35px rgba(56, 189, 248, 0.25);
            transform: scale(1.08);
        }

        /* Click Shockwave Blast */
        .shockwave {
            position: absolute;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            opacity: 0;
            pointer-events: none;
        }
        .shockwave.trigger-wave {
            animation: waveBlast 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes waveBlast {
            0% { transform: scale(1); opacity: 0.95; border-width: 4px; }
            100% { transform: scale(13); opacity: 0; border-width: 1px; }
        }

        /* 2. SPACIOUS MAIN INTERFACE & STAGGERED 3D ENTRANCE */
        #realm-main {
            opacity: 0;
            transform: scale(0.84) translateY(45px) rotateX(10deg);
            filter: blur(12px);
            pointer-events: none;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s,
                        transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s,
                        filter 0.9s ease 0.25s;
        }
        #realm-main.enter-active {
            opacity: 1;
            transform: scale(1) translateY(0) rotateX(0deg);
            filter: blur(0px);
            pointer-events: auto;
        }

        .stagger-item {
            opacity: 0;
            transform: translateY(24px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .enter-active .stagger-1 { opacity: 1; transform: translateY(0); transition-delay: 0.45s; }
        .enter-active .stagger-2 { opacity: 1; transform: translateY(0); transition-delay: 0.60s; }
        .enter-active .stagger-3 { opacity: 1; transform: translateY(0); transition-delay: 0.75s; }

        .dashboard-card {
            background: rgba(8, 12, 22, 0.88);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.92), 0 0 50px rgba(56, 189, 248, 0.06);
        }
        .avatar-glow {
            padding: 3px;
            background: linear-gradient(135deg, #38bdf8, #6366f1, #ec4899);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.32);
        }
        .bento-bio {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(9, 13, 24, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-left: 4px solid #38bdf8;
        }
        .social-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.09);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .social-box-x:hover {
            border-color: rgba(56, 189, 248, 0.65);
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 12px 35px rgba(56, 189, 248, 0.18);
            transform: translateY(-4px);
        }
        .social-box-tg:hover {
            border-color: rgba(16, 185, 129, 0.65);
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.18);
            transform: translateY(-4px);
        }
    </style>
</head>
